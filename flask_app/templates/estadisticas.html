<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadísticas - Avisos de Adopción</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <!-- Barra superior -->
  <nav class="topbar" aria-label="Atajos">
    <a href="{{ url_for('index') }}">Portada</a>
    <a href="{{ url_for('agregar_aviso') }}">+Agregar aviso</a>
    <a href="{{ url_for('listado') }}">Ver listado</a>
    <a class="active" href="{{ url_for('estadisticas') }}">Estadísticas</a>
  </nav>

  <main class="container">
    <h1>Estadísticas 📊</h1>
    <p>Visualización de las tendencias en adopciones de mascotas registradas en el sistema.</p>

    <section class="estadisticas">
      <!-- Gráfico de líneas -->
      <div class="grafico-container">
        <div id="grafico-lineas" style="width: 100%; height: 400px;">
          <p style="text-align: center; padding: 50px; color: #666;">Cargando gráfico...</p>
        </div>
      </div>

      <!-- Gráfico de torta -->
      <div class="grafico-container">
        <div id="grafico-torta" style="width: 100%; height: 400px;">
          <p style="text-align: center; padding: 50px; color: #666;">Cargando gráfico...</p>
        </div>
      </div>

      <!-- Gráfico de barras -->
      <div class="grafico-container">
        <div id="grafico-barras" style="width: 100%; height: 400px;">
          <p style="text-align: center; padding: 50px; color: #666;">Cargando gráfico...</p>
        </div>
      </div>
    </section>

    <div class="acciones" style="margin-top: 30px;">
      <a class="btn-detalle" href="{{ url_for('index') }}">Volver a la portada</a>
    </div>
  </main>

  <!-- Highcharts Library -->
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="https://code.highcharts.com/modules/exporting.js"></script>
  <script src="https://code.highcharts.com/modules/export-data.js"></script>
  
  <!-- Script de estadísticas -->
  <script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
</body>
</html>
